<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pass the Popcorn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--mint:#E9FBF8;--mint2:#D3F5EF;--teal:#00B3A4;--teal-d:#00857A;--pink:#FF4F9A;--pink-d:#E0307C;--mango:#FFB443;--navy:#1B2A4A;--navy2:#4A5A7A;--line:#C5ECE5;--white:#fff;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--mint);color:var(--navy);font-family:'Bricolage Grotesque',system-ui,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;transition:transform .12s ease,background .2s,box-shadow .2s}
button:active{transform:scale(.97)}
#app{max-width:1100px;margin:0 auto;padding:18px 18px 40px;min-height:100vh}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px 20px;border-radius:16px;font-size:19px;font-weight:600}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-d)}
.btn-pink:active{box-shadow:0 2px 0 var(--pink-d);transform:translateY(4px)}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 6px 0 var(--teal-d)}
.btn-teal:active{box-shadow:0 2px 0 var(--teal-d);transform:translateY(4px)}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--navy)}
.btn-sm{padding:11px 16px;font-size:15px;border-radius:12px;width:auto}
.link{background:none;color:var(--navy2);font-size:14px;text-decoration:underline;padding:6px}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.brand{font-weight:800;color:var(--pink);letter-spacing:-.03em}
.muted{color:var(--navy2)}
.card{background:#fff;border-radius:var(--r);border:1.5px solid var(--line)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:calc(100vh - 60px);gap:18px}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.t-cast{background:var(--pink);color:#fff}.t-characters{background:var(--mango);color:#3A2400}.t-story{background:var(--teal);color:#fff}.t-quote{background:var(--navy);color:#fff}.t-genre{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .5s;transform-style:preserve-3d}
.tile.down{background:#EEF3F6 !important;color:#9AA7BC !important;border:1.5px dashed #C9D3E0}
.tile.flip{animation:tflip .6s ease}
@keyframes tflip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .brand{font-size:22px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFF3DE;border:1.5px solid #FFD89A;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.answer b{font-size:18px}
.clue{background:var(--teal);color:#fff;border-radius:24px;padding:24px 24px 26px;min-height:210px;display:flex;flex-direction:column;gap:14px;animation:cin .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cin{from{transform:rotateX(-70deg) translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.clue .txt{font-size:clamp(24px,3.4vw,36px);line-height:1.25;font-weight:600;letter-spacing:-.01em}
.clue .pill{align-self:flex-start;background:#fff;color:var(--teal-d)}
.trail{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.trail .row{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;padding:10px 12px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.panel{margin-top:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel .q{font-size:18px;font-weight:500}
.panel .q b{color:var(--pink);font-weight:800}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{padding:16px 10px;border-radius:14px;font-size:17px;font-weight:600}
.players{padding:8px 16px}
.pl{display:flex;flex-direction:column;gap:8px;padding:13px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .nm{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.pl .tiles{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.tag-r{background:var(--navy);color:#fff}.tag-c{background:var(--pink);color:#fff}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 8px;border-radius:14px;font-size:17px;font-weight:600}
.gbtn small{font-size:12px;font-weight:500;opacity:.85}
.g-ok{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.g-no{background:#EEF3F6;color:#7D8AA2}
.confirm{background:#FFF3DE;border:1.5px solid #FFD89A;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.warn{font-size:14px;color:#9A4A00}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:13px 20px;border-radius:14px;font-size:15px;max-width:90vw;transition:transform .3s;z-index:9;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.inp{width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--line);font-family:inherit;font-size:18px;color:var(--navy);background:#fff;outline:none}
.inp:focus{border-color:var(--teal)}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:11px;border-radius:10px;background:none;font-size:15px;font-weight:600;color:var(--navy2)}
.seg button.on{background:var(--teal);color:#fff}
.err{color:#C2185B;font-size:14px;min-height:18px}
.big{font-size:clamp(44px,9vw,84px);font-weight:800;color:var(--pink);letter-spacing:-.04em;line-height:1}
.soon{opacity:.55}
.burst span{position:absolute;width:14px;height:14px;border-radius:50%;animation:pop 1.4s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
.result-title{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.movie{font-size:clamp(26px,4.5vw,40px);font-weight:800;color:var(--teal-d)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

 }

}
function guess(pi,right){
 const p=S.players[pi],t=S.current;
 const idx=p.tiles.findIndex(x=>x.type===t&&!x.down);
 const legal=idx>-1&&!S.guessed.includes(pi);
 UI.confirm=null;
 if(!legal){
  const d=p.tiles.findIndex(x=>x.down);
  if(d>-1){p.tiles[d].down=false;UI.flipKey=[pi+'-'+d]}
  S.guessed.push(pi);
  if(right){endMovie({kind:'blocked',p:pi,back:d>-1});return}
  toast(`Rule #5! ${p.name} ${d>-1?'flips a tile back up':'had no tile to flip back'}.`);
 }else if(right){p.tiles[idx].down=true;endMovie({kind:'got',p:pi,type:t,ti:idx});return}
 else{S.guessed.push(pi);toast(`Nope! ${p.name} is out of guesses for this movie.`)}
 save();render();
}

}

const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/[-:]/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/^the /,'').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n2=b.length;if(!m)return n2;if(!n2)return m;let prev=Array.from({length:n2+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n2;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n2]}

 let panel;
 if(SO.done){const ok=SO.done.ok;
  panel=`<div style="text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center">${ok?`<div class="burst" style="position:relative;width:0;height:0">${Array.from({length:16},(_,i)=>{const a=i/16*6.283,d=90+Math.random()*60;return `<span style="background:${['#FF4F9A','#FFB443','#00B3A4','#1B2A4A'][i%4]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px"></span>`}).join('')}</div>`:''}
  <div class="result-title" style="font-size:36px;color:${ok?'var(--pink)':'var(--navy)'}">${ok?'Got it! +'+SO.done.pts:'Out of clues'}</div>
  <div class="muted">${ok?'The movie was':'It was'}</div><div class="movie">${esc(m.a)}</div>
  <button class="btn btn-pink" style="margin-top:8px" onclick="sAct('next')">${SO.n>=10?'See my final score':'Next movie'}</button></div>`}
 else{panel=`<div class="q">Guess now for <b>${pts} point${pts===1?'':'s'}</b></div><div style="display:flex;gap:8px">${meter}</div>
  <form onsubmit="event.preventDefault();sAct('guess')" style="display:flex;gap:8px"><input id="sg" class="inp" autocomplete="off" autocapitalize="words" placeholder="Type the movie title" value="${esc(UI.guess||'')}"><button class="btn btn-pink btn-sm" style="flex:0 0 auto;padding:0 22px">Guess</button></form>
  ${left.length?`<div style="font-weight:600;margin-top:4px">Or reveal a clue <span class="muted" style="font-weight:500">(−1 point)</span></div><div class="opts">${left.map(t=>`<button class="opt t-${t}" onclick="sAct('reveal','${t}')">${LABEL[t]}</button>`).join('')}</div>`:''}
  <div class="row2">${SO.skips?`<button class="btn btn-ghost btn-sm" onclick="sAct('skip')">🍿 Skip movie</button>`:''}<button class="btn btn-ghost btn-sm" onclick="sAct('giveup')">Give up</button></div>`}
 return `<div class="top"><div style="display:flex;align-items:center;gap:8px">${logo(34)}<span class="brand">Box Office Run</span></div><div style="display:flex;align-items:center;gap:14px"><span style="display:flex;gap:4px" title="Skips left">${dots}</span><span class="pill t-genre">Movie ${SO.n}/10</span><span class="pill t-cast">${SO.score} pts</span><button class="btn btn-ghost btn-sm" onclick="act('home')">Menu</button></div></div>
 <div style="max-width:720px;margin:0 auto"><div class="clue" key="${cur}"><span class="pill">${LABEL[cur]}${cur==='genre'?'':' clue'}</span><div class="txt">${esc(m[KEY[cur]])}</div></div>
 ${trail?`<div class="trail">${trail}</div>`:''}<div class="card panel">${panel}</div></div>`}
function soloEnd(){const[r,t]=rankFor(SO.score);
 return `<div class="center"><div class="burst" style="position:relative;width:0;height:0">${Array.from({length:22},(_,i)=>{const a=i/22*6.283,d=140+Math.random()*90;return `<span style="background:${['#FF4F9A','#FFB443','#00B3A4','#1B2A4A'][i%4]};--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px"></span>`}).join('')}</div>${logo(80)}
 <span class="pill t-characters">${SO.newBest?'New best score!':'Run complete'}</span><div class="big">${SO.score}<span style="font-size:.4em;color:var(--navy2)"> / 50</span></div><div class="result-title" style="font-size:32px">${r}</div><p class="muted" style="margin:0;font-size:17px">${t}</p>
 <div class="card" style="width:100%;max-width:440px;padding:6px 18px;text-align:left">${SO.log.map(l=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><span>${esc(l.a)}</span><b style="color:${l.pts?'var(--pink)':'var(--navy2)'}">${l.pts?'+'+l.pts:'0'}</b></div>`).join('')}</div>
 <p class="muted" style="margin:0">Best: ${best} / 50</p><div class="stack"><button class="btn btn-pink" onclick="sAct('start')">Play another run</button><button class="btn btn-ghost" onclick="SO=null;ls.del('ptp_solo');act('home')">Home</button></div></div>`}
function render(){
 const s=UI.screen;const map={soloIntro:soloIntro,solo:soloScreen,soloEnd:soloEnd,home:screenHome,setup:screenSetup,pass:screenPass,reader:screenReader,result:screenResult,quit:screenQuit};
 if(['pass','reader','result','quit'].includes(s)&&!S){UI.screen='home'}if(['solo','soloEnd'].includes(s)&&!SO){UI.screen='home'}
 document.getElementById('app').innerHTML=(map[UI.screen]||screenHome)();
 UI.flipKey=null;
}
render();
</script>
</body>
</html>
