<head>

<style>
:root{--mint:#E9FBF8;--mint2:#D3F5EF;--teal:#00B3A4;--teal-d:#00857A;--pink:#FF4F9A;--pink-d:#E0307C;--mango:#FFB443;--navy:#1B2A4A;--navy2:#4A5A7A;--line:#C5ECE5;--white:#fff;--r:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--mint);color:var(--navy);font-family:'Bricolage Grotesque',system-ui,sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;transition:transform .12s ease,background .2s,box-shadow .2s}
button:active{transform:scale(.97)}
#app{max-width:1100px;margin:0 auto;padding:18px 18px 40px;min-height:100vh}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:18px 20px;border-radius:16px;font-size:19px;font-weight:600}
.btn-pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 var(--pink-d)}
.btn-pink:active{box-shadow:0 2px 0 var(--pink-d);transform:translateY(4px)}
.btn-teal{background:var(--teal);color:#fff;box-shadow:0 6px 0 var(--teal-d)}
.btn-teal:active{box-shadow:0 2px 0 var(--teal-d);transform:translateY(4px)}
.btn-ghost{background:#fff;border:2px solid var(--line);color:var(--navy)}
.btn-sm{padding:11px 16px;font-size:15px;border-radius:12px;width:auto}
.link{background:none;color:var(--navy2);font-size:14px;text-decoration:underline;padding:6px}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.brand{font-weight:800;color:var(--pink);letter-spacing:-.03em}
.muted{color:var(--navy2)}
.card{background:#fff;border-radius:var(--r);border:1.5px solid var(--line)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:calc(100vh - 60px);gap:18px}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap}
.t-cast{background:var(--pink);color:#fff}.t-characters{background:var(--mango);color:#3A2400}.t-story{background:var(--teal);color:#fff}.t-quote{background:var(--navy);color:#fff}.t-genre{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.tile{display:inline-flex;align-items:center;justify-content:center;min-width:92px;padding:8px 12px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .5s;transform-style:preserve-3d}
.tile.down{background:#EEF3F6 !important;color:#9AA7BC !important;border:1.5px dashed #C9D3E0}
.tile.flip{animation:tflip .6s ease}
@keyframes tflip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.top .brand{font-size:22px}
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.answer{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FFF3DE;border:1.5px solid #FFD89A;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.answer b{font-size:18px}
.clue{background:var(--teal);color:#fff;border-radius:24px;padding:24px 24px 26px;min-height:210px;display:flex;flex-direction:column;gap:14px;animation:cin .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes cin{from{transform:rotateX(-70deg) translateY(-10px);opacity:0}to{transform:none;opacity:1}}
.clue .txt{font-size:clamp(24px,3.4vw,36px);line-height:1.25;font-weight:600;letter-spacing:-.01em}
.clue .pill{align-self:flex-start;background:#fff;color:var(--teal-d)}
.trail{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.trail .row{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4;padding:10px 12px;background:#fff;border-radius:12px;border:1px solid var(--line)}
.panel{margin-top:14px;padding:18px;display:flex;flex-direction:column;gap:12px}
.panel .q{font-size:18px;font-weight:500}
.panel .q b{color:var(--pink);font-weight:800}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{padding:16px 10px;border-radius:14px;font-size:17px;font-weight:600}
.players{padding:8px 16px}
.pl{display:flex;flex-direction:column;gap:8px;padding:13px 0;border-bottom:1px solid var(--line)}
.pl:last-child{border-bottom:0}
.pl .nm{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}
.pl .tiles{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.tag-r{background:var(--navy);color:#fff}.tag-c{background:var(--pink);color:#fff}
.gbtn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:14px 8px;border-radius:14px;font-size:17px;font-weight:600}
.gbtn small{font-size:12px;font-weight:500;opacity:.85}
.g-ok{background:var(--pink);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.g-no{background:#EEF3F6;color:#7D8AA2}
.confirm{background:#FFF3DE;border:1.5px solid #FFD89A;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.warn{font-size:14px;color:#9A4A00}
.row2{display:flex;gap:10px}
.row2>*{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--navy);color:#fff;padding:13px 20px;border-radius:14px;font-size:15px;max-width:90vw;transition:transform .3s;z-index:9;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.inp{width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--line);font-family:inherit;font-size:18px;color:var(--navy);background:#fff;outline:none}
.inp:focus{border-color:var(--teal)}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px}
.seg button{flex:1;padding:11px;border-radius:10px;background:none;font-size:15px;font-weight:600;color:var(--navy2)}
.seg button.on{background:var(--teal);color:#fff}
.err{color:#C2185B;font-size:14px;min-height:18px}
.big{font-size:clamp(44px,9vw,84px);font-weight:800;color:var(--pink);letter-spacing:-.04em;line-height:1}
.soon{opacity:.55}
.burst span{position:absolute;width:14px;height:14px;border-radius:50%;animation:pop 1.4s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(1);opacity:0}}
.result-title{font-size:clamp(34px,6vw,56px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.movie{font-size:clamp(26px,4.5vw,40px);font-weight:800;color:var(--teal-d)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function guess(pi,right){
 const p=S.players[pi],t=S.current;
 const idx=p.tiles.findIndex(x=>x.type===t&&!x.down);
 const legal=idx>-1&&!S.guessed.includes(pi);
 UI.confirm=null;
 if(!legal){
  const d=p.tiles.findIndex(x=>x.down);
  if(d>-1){p.tiles[d].down=false;UI.flipKey=[pi+'-'+d]}
  S.guessed.push(pi);
  if(right){endMovie({kind:'blocked',p:pi,back:d>-1});return}
  sfx('penalty');toast(`Rule #5! ${p.name} ${d>-1?'flips a tile back up':'had no tile to flip back'}.`);
 }else if(right){p.tiles[idx].down=true;endMovie({kind:'got',p:pi,type:t,ti:idx});return}
 else{sfx('wrong');S.guessed.push(pi);toast(`Nope! ${p.name} is out of guesses for this movie.`)}
 save();render();
}
function endMovie(r){
 const m=DECK[S.card];if(!seen.includes(m.a))seen.push(m.a);
 S.result=r;S.roundWon=false;
 if(r.kind==='got'){const p=S.players[r.p];tal(p).right++;if(p.tiles.every(t=>t.down)){tal(p).rounds++;if(p.count>=S.target){S.over=true;S.winner=r.p}else{p.count++;S.roundWon=true}}}
 if(r.kind==='blocked')tal(S.players[r.p]).blocks++;
 if(r.kind==='got')sfx(S.over?'win':S.roundWon?'round':'right');else if(r.kind==='blocked')sfx('penalty');
 S.screen=UI.screen='result';save();render();
}

const ALIAS={"Ocean's Eleven":["oceans 11"],"The 40-Year-Old Virgin":["40 year old virgin","the 40 year old virgin"],"Avengers: Endgame":["endgame","avengers endgame"],"The Avengers":["avengers"],"Harry Potter and the Sorcerer's Stone":["harry potter","harry potter and the philosophers stone"],"The Lord of the Rings: The Fellowship of the Ring":["lord of the rings","fellowship of the ring","the fellowship of the ring"],"Anchorman: The Legend of Ron Burgundy":["anchorman"],"Pirates of the Caribbean: The Curse of the Black Pearl":["pirates of the caribbean","curse of the black pearl"],"Star Wars: The Force Awakens":["the force awakens","force awakens","star wars 7","star wars episode vii"],"Mad Max: Fury Road":["fury road"],"Top Gun: Maverick":["top gun 2"],"Everything Everywhere All at Once":["everything everywhere"],"Borat":["borat cultural learnings of america"]};
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/&/g,' and ').replace(/[-:]/g,' ').replace(/[^a-z0-9 ]/g,'').replace(/^the /,'').replace(/\s+/g,' ').trim();
function lev(a,b){const m=a.length,n2=b.length;if(!m)return n2;if(!n2)return m;let prev=Array.from({length:n2+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n2;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n2]}
function matches(guess,title){const g=norm(guess);if(g.length<2)return false;const opts=[title,title.split(':')[0],...(ALIAS[title]||[])].map(norm);return opts.some(o=>g===o||lev(g,o)<=(o.length<=4?0:Math.max(1,Math.floor(o.length/4))))}

 switch(a){

 case 'start':if(mixPool().length<12){toast('Your movie mix is under 12 movies. Widen it under Movie mix.');return}UI.cardMenu=false;SO={n:1,score:0,skips:3,used:[],log:[],over:false};soloNew();UI.screen='solo';break;

  const m=DECK[SO.card];
  if(matches(g,m.a)){const p=PTS(SO.rev);SO.score+=p;SO.done={ok:true,pts:p};SO.log.push({a:m.a,pts:p});sfx('right')}
  else{sfx('wrong');SO.wrong++;const left=TYPES.filter(t=>!SO.rev.includes(t));

 case 'quit':SO=null;ls.del('ptp_solo');UI.screen='home';break;
 }
 soloSave();render();

 <p style="margin:10px 0 0;font-weight:600">Decades</p><div style="display:flex;gap:8px;flex-wrap:wrap">${DECADES.map(d=>chip(F.dec.includes(d),d,`act('fdec','${d}')`)).join('')}</div>
 <p style="margin:10px 0 0;font-weight:600">Genres</p><div style="display:flex;gap:8px;flex-wrap:wrap">${GENRES.map(g=>chip(F.gen.includes(g[0]),g[1],`act('fgen','${g[0]}')`)).join('')}</div>
 <p style="margin:10px 0 0;font-weight:600">Ratings</p><div class="seg">${RATES.map(r=>`<button class="${F.rate===r[0]?'on':''}" onclick="act('frate','${r[0]}')">${r[1]}</button>`).join('')}</div>
 <p class="muted" style="font-size:13px;margin:4px 0 0">The mix applies to group games and Box Office Run. Retired movies are always left out.</p>
 <button class="btn btn-pink" style="margin-top:10px" onclick="act('back')">Done</button></div>`}
function deckRows(){const q=norm(UI.q||'');const tab=UI.tab||'all';
 return DECK.map((d,i)=>({d,i})).filter(({d})=>{if(tab==='retired'&&!RET.includes(d.a))return false;if(q&&!norm(d.a).includes(q))return false;return true}).sort((x,y)=>x.d.a.localeCompare(y.d.a)).map(({d,i})=>{const r=RET.includes(d.a),fl=FLAGS.filter(f=>f.a===d.a).map(f=>f.why).join(', ');return `<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)${r?';opacity:.55':''}"><div style="flex:1;min-width:0"><div style="font-weight:600;${r?'text-decoration:line-through':''}">${esc(d.a)}</div><div class="muted" style="font-size:13px">${yearOf(d)} · ${RATING[d.a]||'?'}${fl?` · <span style="color:#C2185B">Flagged: ${esc(fl)}</span>`:''}</div></div><button class="btn btn-ghost btn-sm" onclick="act('ret',${i})">${r?'Restore':'Retire'}</button></div>`}).join('')||'<p class="muted">No movies match.</p>'}
function renderDeckList(){const el=document.getElementById('decklist');if(el)el.innerHTML=deckRows();const c=document.getElementById('retcount');if(c)c.textContent=RET.length;}
function screenDeck(){const tab=UI.tab||'all';
 const flags=tab==='flagged'?`<div class="card" style="padding:14px 18px">${FLAGS.length?FLAGS.map((f,k)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b>${esc(f.a)}</b> <span class="muted">· ${esc(f.why)}</span></div><button class="link" onclick="act('unflag',${k})">Clear</button></div>`).join('')+`<button class="btn btn-teal btn-sm" style="margin-top:12px" onclick="act('copyFlags')">Copy list to send to Claude</button><textarea readonly class="inp" style="margin-top:10px;height:110px;font-size:14px">${esc(flagsText())}</textarea>`:'<p class="muted" style="margin:6px 0">Nothing flagged. While playing, tap "Flag / retire" on any card that has wrong info or is too easy or too hard.</p>'}</div>`:'';
 return `${topBack('Your deck')}<div class="stack" style="margin:0 auto;max-width:640px">
 <div class="seg"><button class="${tab==='all'?'on':''}" onclick="act('tab','all')">All ${DECK.length}</button><button class="${tab==='retired'?'on':''}" onclick="act('tab','retired')">Retired <span id="retcount">${RET.length}</span></button><button class="${tab==='flagged'?'on':''}" onclick="act('tab','flagged')">Flagged ${FLAGS.length}</button></div>
 ${tab==='flagged'?flags:`<input class="inp" placeholder="Search movies" value="${esc(UI.q||'')}" oninput="UI.q=this.value;renderDeckList()"><div class="card" style="padding:4px 18px" id="decklist">${deckRows()}</div><p class="muted" style="font-size:13px">A retired movie never comes up in either mode. Tap Restore to bring it back.</p>`}</div>`}
function screenStats(){const rows=Object.entries(STATS.players).sort((a,b)=>b[1].wins-a[1].wins||b[1].rounds-a[1].rounds);const so=STATS.solo;
 const th='style="text-align:right;padding:8px 6px;font-size:13px;color:var(--navy2);font-weight:600"',td='style="text-align:right;padding:10px 6px"';
 return `${topBack('Stats')}<div class="stack" style="margin:0 auto;max-width:640px">
 <h3 style="font-size:20px">Group games</h3>
 <div class="card" style="padding:6px 14px;overflow-x:auto">${rows.length?`<table style="width:100%;border-collapse:collapse;font-size:16px"><tr><th style="text-align:left;padding:8px 6px;font-size:13px;color:var(--navy2);font-weight:600">Player</th><th ${th}>Games</th><th ${th}>Wins</th><th ${th}>Rounds</th><th ${th}>Correct</th><th ${th}>Blocks</th></tr>${rows.map(([nm,s],k)=>`<tr style="border-top:1px solid var(--line)"><td style="padding:10px 6px;font-weight:600">${k===0&&s.wins?'🏆 ':''}${esc(nm)}</td><td ${td}>${s.games}</td><td ${td}><b style="color:var(--pink)">${s.wins}</b></td><td ${td}>${s.rounds}</td><td ${td}>${s.right}</td><td ${td}>${s.blocks}</td></tr>`).join('')}</table>`:'<p class="muted">Finish a group game and the scoreboard starts here.</p>'}</div>
 <h3 style="font-size:20px;margin-top:8px">Box Office Run</h3>
 <div class="opts"><div class="card" style="padding:14px 18px"><div class="muted" style="font-size:13px">Best score</div><div style="font-size:28px;font-weight:800;color:var(--pink)">${best||0}<span class="muted" style="font-size:14px"> / 50</span></div></div><div class="card" style="padding:14px 18px"><div class="muted" style="font-size:13px">Runs · average</div><div style="font-size:28px;font-weight:800">${so.runs}<span class="muted" style="font-size:14px"> · ${so.runs?Math.round(so.total/so.runs):0} avg</span></div></div></div>
 <p class="muted" style="font-size:13px">Stats are kept on this device. Players are matched by name.</p>
 <button class="btn btn-ghost btn-sm" style="align-self:flex-start;${UI.confirmReset?'color:#C2185B;border-color:#C2185B':''}" onclick="act('resetStats')">${UI.confirmReset?'Tap again to erase all stats':'Reset stats'}</button></div>`}
function render(){
 const s=UI.screen;const map={mix:screenMix,deck:screenDeck,stats:screenStats,soloIntro:soloIntro,solo:soloScreen,soloEnd:soloEnd,home:screenHome,setup:screenSetup,pass:screenPass,reader:screenReader,result:screenResult,quit:screenQuit};
 if(['pass','reader','result','quit'].includes(s)&&!S){UI.screen='home'}if(['solo','soloEnd'].includes(s)&&!SO){UI.screen='home'}
 document.getElementById('app').innerHTML=(map[UI.screen]||screenHome)();
 UI.flipKey=null;
}
render();
try{if('serviceWorker' in navigator&&isGH())navigator.serviceWorker.register('sw.js')}catch(e){}
</script>
</body>
</html>
