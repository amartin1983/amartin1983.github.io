<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fresh Codenames Grids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Stardos+Stencil:wght@400;700&family=Special+Elite&family=Oswald:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Alfa+Slab+One&family=Bitter:wght@400;600;700&family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;600;700;800&family=Press+Start+2P&family=VT323&family=Bungee&family=Teko:wght@500;600;700&family=Graduate&family=Creepster&family=Fredoka:wght@500;600;700&family=Pirata+One&family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Limelight&display=swap">
<style>
/* Layout: one narrow column you thumb through at the table; sticky agency header, 5x5 board as the hero, tab bar pinned to the bottom.
   Two deliberate single-world looks: "Spy HQ" (dark briefing room) and "Classified" (manila file). Each sets every color itself. */
:root{
  --bg:#0b1017; --bg2:#101722; --panel:#151e2b; --panel2:#1b2636; --line:#273448;
  --fg:#ebe5d5; --muted:#9aa3b2; --faint:#647083;
  --brass:#d6a64f; --brass-ink:#1b1305; --brass-soft:rgba(214,166,79,.16); --glow:rgba(214,166,79,.38);
  --red:#d9533f; --blue:#4c8ae0; --green:#58ad6d; --tan:#cbb78d; --ink:#07080b;
  --card:#ece1c6; --card2:#d8c8a2; --card-ink:#2a2216; --card-line:#b49f74; --label:#fbf6e9;
  --cut:#101722; --shadow:rgba(0,0,0,.45);
  --f-stencil:"Stardos Stencil","Stencil",Impact,sans-serif;
  --f-type:"Special Elite","Courier New",ui-monospace,monospace;
  --f-word:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Libre Franklin",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px;
  color-scheme:dark;
}
html.file{
  --bg:#e2d3ae; --bg2:#ece0c2; --panel:#f6efdb; --panel2:#eee3c8; --line:#c6b388;
  --fg:#2b2418; --muted:#6b5d43; --faint:#94845f;
  --brass:#a8281d; --brass-ink:#fff7ea; --brass-soft:rgba(168,40,29,.1); --glow:rgba(168,40,29,.25);
  --red:#b9382a; --blue:#2c5d9f; --green:#3c7f4d; --tan:#bba476; --ink:#16130e;
  --card:#fbf6e8; --card2:#eee2c4; --card-ink:#2a2216; --card-line:#c9b68a; --label:#ffffff;
  --cut:#f6efdb; --shadow:rgba(80,60,20,.25);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse at 50% -10%,rgba(214,166,79,.09),transparent 60%)}
html.file body{background-image:repeating-linear-gradient(0deg,rgba(120,90,30,.05) 0 1px,transparent 1px 28px),radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.5),transparent 60%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg2)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
svg{fill:currentColor}
.cut{fill:var(--cut)}
svg [fill="none"]{fill:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg2);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none;color:var(--brass);filter:drop-shadow(0 0 7px var(--glow))}
.brand{font-family:var(--f-stencil);font-weight:700;font-size:22px;letter-spacing:.06em;line-height:1;text-transform:uppercase;min-width:0}
.brand small{display:block;font-family:var(--f-type);font-weight:400;font-size:11.5px;letter-spacing:.06em;text-transform:none;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;white-space:nowrap}
.iconbtn svg{width:16px;height:16px}

main{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg2);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tab{background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"]{color:var(--brass)}

/* type */
h2{font-family:var(--f-stencil);font-weight:700;font-size:24px;letter-spacing:.05em;text-transform:uppercase;margin:0;line-height:1.1;text-wrap:balance}
h3{font-size:15.5px;margin:0;font-weight:700}
.eyebrow{font-family:var(--f-type);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:13px} .hint{font-size:12.5px;color:var(--faint);margin:0}
.sec{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card p{margin:0;max-width:62ch}

.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;justify-content:center}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:600;font-size:13.5px}
.seg button[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft);color:var(--brass)}
.codebox{display:flex;align-items:center;gap:8px;margin-left:auto}
.codebox label{font-family:var(--f-type);font-size:12px;color:var(--muted)}
.codebox input{font:600 16px var(--f-mono);letter-spacing:.22em;width:6.4em;text-transform:uppercase;padding:8px 6px 8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);text-align:center}
@media (max-width:480px){.codebox{margin-left:0}}

/* scoreboard */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:stretch}
.plate{--tc:var(--red);border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:box-shadow .2s,border-color .2s}
.plate.blue{--tc:var(--blue)} .plate.green{--tc:var(--green)}
.plate.turn{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc) inset,0 0 18px -4px var(--tc)}
.plate-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.plate-name{font-family:var(--f-stencil);font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:var(--tc)}
.plate-ct{font-family:var(--f-mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.plate-ct small{font-size:12px;color:var(--muted);font-weight:500}
.pips{display:flex;flex-wrap:wrap;gap:3px}
.pip{width:13px;height:15px;color:var(--tc)}
.pip.gone{opacity:.22}
.turnflag{font-family:var(--f-type);font-size:11.5px;color:var(--tc);min-height:15px}
.mid{display:flex;flex-direction:column;justify-content:center;gap:6px;align-items:center}
.mid .btn{padding:9px 10px;font-size:13px;white-space:nowrap}
.tokens{display:flex;gap:4px;flex-wrap:wrap}
.tok{width:15px;height:15px;border-radius:50%;border:2px solid var(--brass);background:var(--brass-soft)}
.tok.used{border-color:var(--line);background:transparent;opacity:.6}
.score.duet{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto}
.banner{border:1px dashed var(--brass);border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--brass);background:var(--brass-soft)}

/* clue strip */
.clue{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:4px solid var(--cc,var(--brass));background:var(--panel);border-radius:10px;padding:9px 12px;min-width:0}
.clue .eyebrow{flex:none}
.clue-word{font-family:var(--f-word);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase;line-height:1;min-width:0;overflow-wrap:anywhere}
.clue-n{font-family:var(--f-mono);font-weight:600;font-size:20px;color:var(--cc,var(--brass))}
.cluein{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px}
.cluein input,.cluein select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.cluein input{text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.cluein input::placeholder{text-transform:none;letter-spacing:0;font-weight:400;color:var(--faint)}
.cluelog{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.cluelog li{display:flex;gap:8px;align-items:baseline;border-left:3px solid var(--lc,var(--line));padding-left:8px}
.cluelog b{font-family:var(--f-word);letter-spacing:.05em;font-weight:600}
.cluelog .num{font-family:var(--f-mono);color:var(--muted)}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(5px,1.5vw,10px);perspective:900px}
.cn{position:relative;aspect-ratio:1.48;max-width:100%;border-radius:8px;border:0;padding:0;cursor:pointer;user-select:none;-webkit-user-select:none;
  background:linear-gradient(175deg,var(--card),var(--card2));color:var(--card-ink);
  box-shadow:0 2px 0 var(--shadow),0 5px 12px -6px var(--shadow),inset 0 0 0 3px var(--card),inset 0 0 0 4px var(--card-line);
  display:grid;grid-template-rows:1fr auto;padding:5px 5px 6px;overflow:hidden;transition:transform .12s ease}
.cn:active{transform:scale(.96)}
.cn-top{display:flex;align-items:flex-start;justify-content:space-between;gap:3px;min-height:0;padding:1px 3px 0}
.cn-ico{width:16%;max-width:16px;aspect-ratio:1;color:var(--card-line);flex:none}
.cn-up{font-family:var(--f-word);font-weight:600;text-transform:uppercase;letter-spacing:.03em;transform:rotate(180deg);opacity:.42;white-space:nowrap;line-height:1;font-size:9px;overflow:hidden}
.cn-label{background:var(--label);border-radius:4px;box-shadow:inset 0 0 0 1px var(--card-line);display:flex;align-items:center;justify-content:center;padding:4px 3px;min-width:0}
.cn-w{font-family:var(--f-word);font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;line-height:1;font-size:15px}
@media (max-width:430px){.cn-up{display:none}.cn{padding:4px 3px 4px}.cn-label{padding:4px 2px}}
.cn.cov{--cc:var(--tan);background:linear-gradient(160deg,color-mix(in srgb,var(--cc) 82%,#fff 18%),var(--cc));color:#fff;
  box-shadow:0 2px 0 var(--shadow),inset 0 0 0 3px rgba(255,255,255,.12),inset 0 0 0 4px rgba(0,0,0,.18)}
.cn.cov.c-red{--cc:var(--red)} .cn.cov.c-blue{--cc:var(--blue)} .cn.cov.c-green{--cc:var(--green)} .cn.cov.c-tan{--cc:var(--tan);color:var(--card-ink)} .cn.cov.c-black{--cc:var(--ink);background:radial-gradient(circle at 50% 30%,#2a2c33,var(--ink))}
.cn.cov .cn-top{justify-content:center;align-items:center}
.cn.cov .cn-up{display:none}
.cn.cov .cn-ico{width:auto;max-width:none;height:100%;max-height:44px;color:currentColor;opacity:.92}
.cn.cov .cn-label{background:rgba(0,0,0,.22);box-shadow:none;padding:2px}
.cn.cov.c-tan .cn-label{background:rgba(255,255,255,.35)}
.cn.cov .cn-w{opacity:.85;font-size:9px!important}
.cn.flip{animation:cnflip .45s ease-out}
@keyframes cnflip{0%{transform:rotateY(90deg)}100%{transform:none}}
.board.tint .cn:not(.cov)::after{content:"";position:absolute;inset:auto 0 0 0;height:5px;background:var(--kc)}
.board.tint .cn:not(.cov){box-shadow:0 2px 0 var(--shadow),inset 0 0 0 3px var(--kc),inset 0 0 0 4px var(--card-line)}
.board.picking .cn{outline:1.5px dashed var(--faint);outline-offset:-5px}
.cn.sel{outline:3px solid var(--brass)!important;outline-offset:-3px!important;transform:scale(.94)}
.cn.sel::before{content:"\00d7";position:absolute;top:3px;right:4px;width:16px;height:16px;border-radius:50%;background:var(--brass);color:var(--brass-ink);font:700 14px/16px var(--f-body);text-align:center}
.cn.fresh{animation:cnflip .45s ease-out}
@media (prefers-reduced-motion:reduce){.cn.flip,.cn.fresh{animation:none}.plate{transition:none}}
.boardbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.boardbar .sp{flex:1}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:80;background:rgba(5,7,12,.6)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:81;max-height:82vh;overflow:auto;background:var(--bg2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.sheet>*{max-width:560px;width:100%;margin:0 auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-word{font-family:var(--f-word);font-weight:700;font-size:28px;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.picks{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:8px}
.pk{--tc:var(--red);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:center;font-weight:700;font-size:13px}
.pk.blue{--tc:var(--blue)}.pk.green{--tc:var(--green)}.pk.tan{--tc:var(--tan)}.pk.black{--tc:var(--fg)}
.pk-art{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:var(--tc);background:radial-gradient(circle at 50% 40%,var(--brass-soft),transparent 72%);border:1px solid var(--line)}
.pk-art svg{width:36px;height:36px}
.pk.cur{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.pk small{display:block;font-weight:500;font-size:11px;color:var(--muted)}

/* key */
.keycard{--kb:var(--red);padding:10px;border-radius:14px;background:var(--panel2);border:8px solid var(--kb);box-shadow:0 0 22px -6px var(--kb),inset 0 0 0 1px rgba(0,0,0,.25);transition:filter .15s}
.keycard.blue{--kb:var(--blue)} .keycard.duet{--kb:var(--green)}
.keycard.hide{filter:blur(13px) saturate(.6)}
.kgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.kc{aspect-ratio:1.3;border-radius:6px;display:flex;align-items:flex-end;justify-content:center;padding:3px;background:var(--kcol);color:#fff;font-family:var(--f-word);font-weight:600;text-transform:uppercase;line-height:1;overflow:hidden;position:relative}
.kc.tan{color:var(--card-ink)}
.kc span{white-space:nowrap;font-size:10px}
.kc.done{opacity:.35}
.kc.done::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(0,0,0,.25) 5px 7px)}
.kc svg{position:absolute;top:12%;left:50%;transform:translateX(-50%);width:34%;height:auto;opacity:.6}
.holdbtn{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding:14px}
.togrow{display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px 0;text-align:left;width:100%}
.sw{width:44px;height:26px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:left .15s}
.togrow[aria-pressed="true"] .sw{background:var(--brass);border-color:var(--brass)}
.togrow[aria-pressed="true"] .sw::after{left:20px;background:var(--brass-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* words */
.stamp{display:inline-block;font-family:var(--f-stencil);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);border:2px solid var(--brass);border-radius:4px;padding:2px 8px;transform:rotate(-3deg);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px 6px}
.chip{font-family:var(--f-word);font-weight:500;font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--bg);display:inline-flex;gap:7px;align-items:center}
.chip .str{display:inline-flex;gap:2px}
.chip .str i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--red)}
.chip .str i.on{background:var(--red)}
.chip.gone{text-decoration:line-through;color:var(--faint)}
.chip.new{border-color:var(--green);color:var(--green)}
.pool{display:flex;flex-wrap:wrap;gap:4px 5px;max-height:360px;overflow:auto;padding:2px 4px 2px 0}
.pool button{font-family:var(--f-word);font-weight:500;font-size:12.5px;letter-spacing:.04em;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:3px 8px;border-radius:5px}
.pool button.banned{text-decoration:line-through;color:var(--faint);opacity:.6}
.pool button.retired{text-decoration:line-through;color:var(--faint);opacity:.4;cursor:default}
.pool button.added{border-color:var(--green);color:var(--green)}
.search{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}

/* rules */
details.faq{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
details.faq summary{font-weight:700;cursor:pointer}
details.faq ul,details.faq ol{margin:8px 0 2px;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:6px}
details.faq b{color:var(--fg)}

/* modal + overlays */
.modal{position:fixed;z-index:81;left:50%;top:14%;transform:translateX(-50%);width:min(calc(100% - 32px),440px);background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.lookopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lookopt[aria-pressed="true"]{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass) inset}
.swatch{width:56px;height:42px;border-radius:8px;flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:5px;border:1px solid rgba(0,0,0,.2)}
.swatch i{border-radius:2px}
.lookopt b{display:block;font-family:var(--f-stencil);letter-spacing:.06em;text-transform:uppercase;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--fg);color:var(--bg);font-weight:700;font-size:13.5px;padding:9px 16px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.notice{margin:0;padding:10px 12px;border-radius:10px;border:1px solid var(--green);background:var(--panel);font-size:14px}

.gameover{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;overflow:auto;background:radial-gradient(circle at 50% 25%,#3b1a17,#06070a 72%);
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));color:#efe8d8}
.gameover.go-blue{background:radial-gradient(circle at 50% 25%,#16294a,#06070a 72%)}
.gameover.go-green{background:radial-gradient(circle at 50% 25%,#183522,#06070a 72%)}
.gameover.go-black{background:radial-gradient(circle at 50% 25%,#2a2a2e,#000 72%)}
.go-rays{position:fixed;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(214,166,79,.07) 0deg 8deg,transparent 8deg 20deg);animation:goSpin 40s linear infinite;pointer-events:none}
@keyframes goSpin{to{transform:rotate(360deg)}}
.go-card{position:relative;width:min(100%,460px);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.go-ico{width:110px;height:110px;color:var(--gc,#d6a64f);filter:drop-shadow(0 0 24px var(--gc,#d6a64f));animation:goPop .7s cubic-bezier(.2,1.6,.4,1) both}
.go-ico .cut{fill:#06070a}
.go-red{--gc:#ee6a55}.go-blue{--gc:#6aa4f2}.go-green{--gc:#6fd08a}.go-black{--gc:#c9c3b6}
.go-title{font-family:"Stardos Stencil",Impact,sans-serif;font-weight:700;font-size:clamp(36px,11vw,56px);letter-spacing:.05em;text-transform:uppercase;line-height:1;margin:0;color:var(--gc);text-shadow:0 0 30px var(--gc);animation:goPop .8s .15s cubic-bezier(.2,1.4,.4,1) both}
.go-sub{font-family:"Special Elite","Courier New",monospace;font-size:17px;color:#d8d0bf;margin:0}
.go-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.go-btns .btn{background:#1b2333;border-color:#33405a;color:#efe8d8}
.go-btns .btn.primary{background:var(--gc);border-color:var(--gc);color:#111}
@keyframes goPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.go-rays,.go-ico,.go-title{animation:none}}

/* v5 additions */
.chipline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.modal{max-height:86vh;overflow:auto}

.vol svg{width:20px;height:20px;flex:none;color:var(--muted)}

function counts(){
  const c={red:0,blue:0,green:0,tan:0,black:0};
  Object.values(G.covers).forEach(v=>{ if(c[v]!=null) c[v]++; });
  return c;
}
function totals(){ return G.mode==="classic" ? {[G.first]:9,[other(G.first)]:8} : {green:15}; }

/* ---------- covering + turns ---------- */
function checkWin(){
  if(G.over) return;
  const c=counts(), t=totals();
  if(G.mode==="classic"){
    if(c.red>=t.red){ G.over={kind:"red", why:ED().why.all(TEAM.red)}; }
    else if(c.blue>=t.blue){ G.over={kind:"blue", why:ED().why.all(TEAM.blue)}; }
  } else if(c.green>=15){ G.over={kind:"green", why:ED().why.duetWin}; }
}
function cover(i, choice){
  const prev=G.covers[i], wasOver=!!G.over;
  if(choice===null){ delete G.covers[i]; delete G.by[i]; }
  else if(G.mode==="duet" && choice==="tan"){
    const b = G.by[i] = {...(G.by[i]||{})}; const fresh=!b[G.giver]; b[G.giver]=1;
    if(b.A&&b.B) G.covers[i]="tan"; else delete G.covers[i];
    flipIdx.add(i); sfx("bystander");
    if(fresh && !G.over){ endTurn(true); return; }
  }
  else {
    G.covers[i]=choice; flipIdx.add(i);
    const isNew = !prev;
    if(choice==="black"){ sfx("assassin"); if(isNew && !G.over) G.over = G.mode==="classic" ? {kind:other(G.turn), why:ED().why.assassin(TEAM[G.turn])} : {kind:"black", why:ED().why.duetLose}; }
    else if(choice==="tan"){ sfx("bystander"); if(isNew && !G.over){ G.turn=other(G.turn); toast(`${ROLE_NAME.tan}. ${TEAM[G.turn]}'s turn.`); } }
    else {
      sfx("agent",choice);
      if(G.mode==="classic" && isNew && !G.over && choice!==G.turn){ G.turn=other(G.turn); toast(`Wrong team. ${TEAM[G.turn]}'s turn.`); }
    }
  }
  checkWin();
  if(G.over && !wasOver){ dismissed=false; if(G.over.kind!=="black") setTimeout(()=>sfx("win"),350); }
  changed();
}
function endTurn(auto){
  if(G.over) return;
  if(G.mode==="classic"){ G.turn=other(G.turn); toast(`${TEAM[G.turn]}'s turn.`); }
  else {
    G.turnsLeft=Math.max(0,G.turnsLeft-1); G.giver = G.giver==="A"?"B":"A";
    toast(G.turnsLeft? `${auto?ROLE_NAME.tan+". ":""}Turn over. Side ${G.giver} gives the next clue. ${G.turnsLeft} left.` : `${auto?ROLE_NAME.tan+". ":""}Out of turns. Sudden death.`);
  }
  sfx("turn");
  changed();
}
function toast(t){ const el=$("#toast"); if(!el) return; el.textContent=t; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;},2600); }
function changed(){ G.rev=(G.rev||0)+1; G.at=Date.now(); saveGame(); render(); pushSync(); }

/* ---------- clue checks ---------- */
function clueProblem(w){
  const c=strip(w).replace(/[^A-Z]/g,""); if(!c) return "Type the clue word first.";
  const stems = s => [s, s.replace(/ES$/,""), s.replace(/S$/,"")];
  for(let i=0;i<25;i++){
    if(G.covers[i]) continue;
    const word=G.grid[i], parts=strip(word).split(/[^A-Z]+/).filter(Boolean).concat(strip(word).replace(/[^A-Z]/g,""));
    for(const p of parts){
      if(stems(c).some(x=>stems(p).includes(x))) return `${word} is on the board. Pick a different clue.`;
      if(p.length>=4 && c.includes(p)) return `Your clue contains ${word}, which is on the board.`;
      if(c.length>=4 && p.includes(c)) return `${word} contains your clue. Pick a different clue.`;
    }
  }
  return null;
}

  const c=counts(), t=totals();

    const plate=(team)=>{
      const left=t[team]-c[team];
      return `<div class="plate ${team} ${G.turn===team&&!G.over?"turn":""}">
        <div class="plate-h"><span class="plate-name">${TEAM[team]}</span><span class="plate-ct">${left}<small> left</small></span></div>
        <div class="pips">${Array.from({length:t[team]},(_,k)=>`<svg class="pip ${k<c[team]?"gone":""}"><use href="#i-agent"/></svg>`).join("")}</div>
        <div class="turnflag">${G.turn===team&&!G.over?"Their turn":G.first===team?"Went first":""}</div></div>`;
    };
    return `<div class="score">${plate("red")}<div class="mid"><button class="btn" data-act="endturn" ${G.over?"disabled":""}>End turn</button></div>${plate("blue")}</div>`;
  }

  return `<div class="score duet">
    <div class="plate green turn"><div class="plate-h"><span class="plate-name">${edition==="classic"?"Agents":esc(ROLE_NAME.green)}</span><span class="plate-ct">${c.green}<small> / 15</small></span></div>

  </div>

       :`<div class="giver"><span class="small">Clue giver: <b>Side ${G.giver}</b> <span class="muted">· guesses follow Side ${G.giver}'s key</span></span><button class="btn ghost" data-act="giver" style="padding:6px 10px;font-size:12.5px">Switch</button></div>`}`;

  const last = G.clues[G.clues.length-1];
  const col = c => c.team==="red"?"var(--red)":c.team==="blue"?"var(--blue)":"var(--green)";
  const who = G.mode==="classic" ? TEAM[G.turn]+" spymaster's" : "Side "+G.giver+"'s";
  return `<div class="sec">
    ${last?`<div class="clue" style="--cc:${col(last)}"><span class="eyebrow">${esc(last.label)}</span><span class="clue-word grow">${esc(last.word)}</span><span class="clue-n">${esc(last.n)}</span></div>`:""}
    <form class="cluein" id="clueform" autocomplete="off">
      <input id="clueword" maxlength="24" placeholder="${who} clue" aria-label="Clue word" ${G.over?"disabled":""}>
      <select id="cluen" aria-label="Number">${["1","2","3","4","5","6","7","8","9","0","∞"].map(n=>`<option>${n}</option>`).join("")}</select>

    </form>

function wireHold(){

/* ---------- replace + tracker ---------- */
function doReplace(){
  if(!picking){ picking=true; selected=new Set(); render(); return; }
  if(!selected.size){ render(); return; }
  const old=[], onBoard=new Set(G.grid);
  [...selected].sort((a,b)=>a-b).forEach(i=>{
    while(G.nextIdx<G.order.length && onBoard.has(G.order[G.nextIdx])) G.nextIdx++;
    if(G.nextIdx>=G.order.length) return;
    old.push(G.grid[i]); G.grid[i]=G.order[G.nextIdx++]; onBoard.add(G.grid[i]); delete G.covers[i]; delete G.by[i]; flipIdx.add(i);
  });
  picking=false; selected=new Set(); sfx("swap"); changed();
  recordReplacements(old);
}
async function recordReplacements(old){
  const newly=[];
  old.forEach(w=>{
    const k=G.mode+":"+G.code+":"+w;
    if(S.seen.includes(k)) return;
    S.seen.push(k);
    const n=(S.counts[w]||0)+1; S.counts[w]=n;
    if(n>=3 && !S.retired.includes(w)){ S.retired.push(w); newly.push(w); }
  });
  if(S.seen.length>400) S.seen=S.seen.slice(-400);
  await saveTracker(); render();
  if(newly.length) await findReplacements(newly);
}
function setNotice(t){ noticeText=t; render(); }
async function findReplacements(ret){
  const names=ret.join(", "), need=ret.length*2;
  if(!sampleFn){ setNotice(`Retired ${names} after 3 replacements. New words can be added once this page is allowed to ask Claude.`); return; }
  setNotice(`Retired ${names} after 3 replacements. Asking Claude for ${need} new words…`);
  const taken=new Set([...USED,...allWords().map(strip),...S.retired.map(strip)]);
  const prompt=`I'm playing the word game Codenames with a custom word pool. Suggest ${need+6} new words for the pool.
Each word must be a common, concrete English noun that adults and teens all know, one word (no proper names, brands or phrases), and it should have more than one meaning or lots of associations so clue-givers can link it to other words.
Players found these words too hard and removed them, so avoid obscure or very specific words like them: ${S.retired.join(", ")}.
Do not suggest any word from the original Codenames or Codenames Duet boxes, or any word already in my pool. Here are words to avoid: ${S.retired.concat(Object.keys(S.counts)).slice(0,200).join(", ")}.
Reply with only a JSON array of uppercase strings, for example ["LANTERN","SPARK"].`;
  try{
    const out=await sampleFn.json(prompt,{modelTier:"quick",cache:false});
    const got=[];
    for(const x of Array.isArray(out)?out:[]){
      const w=String(x).toUpperCase().trim();
      if(!/^[A-Z][A-Z-]{1,13}$/.test(w)) continue;
      if([w,w.replace(/E?S$/,""),w+"S",w+"ES"].some(s=>taken.has(s))) continue;
      taken.add(w); got.push(w); if(got.length>=need) break;
    }
    ret.forEach((r,k)=>got.slice(k*2,k*2+2).forEach(w=>S.added.push({word:w,for:r})));
    await saveTracker();
    setNotice(got.length?`Retired ${names}. Added ${got.join(", ")} to the word bank.`:`Retired ${names}. Claude's suggestions were already in use, so nothing new was added this time.`);
  }catch(e){
    const why=e&&(e.code==="not_granted"||e.code==="sampling_disabled")?" because asking Claude wasn't allowed":e&&e.code==="rate_limited"?" because of a usage limit":"";
    setNotice(`Retired ${names}. Couldn't get new words right now${why}.`);
  }
}

function compactKeys(){ const c=compact(); c.ka=keyStr(G.keyA); c.kb=keyStr(G.keyB); c.cv=G.grid.map((_,i)=>{const v=G.covers[i]; return v?(v==="black"?"k":v[0]):"-";}).join(""); return c; }
function adopt(st){
  if(!st || st.v!==2 || !Array.isArray(st.g) || st.g.length!==25) return;
  const old=G.covers;
  if(st.ed && EDS[st.ed] && st.ed!==edition){ edition=st.ed; ls.set("cn-ed",edition); }
  G.ed=edition;
  G.grid=st.g.map(String).slice(0,25); G.keyA=keyFrom(st.ka); G.keyB=st.m==="duet"?keyFrom(st.kb):[]; G.first=st.f==="blue"?"blue":"red"; G.turn=st.t==="blue"?"blue":"red";
  G.covers={}; String(st.cv||"").split("").forEach((ch,i)=>{ if(LET[ch]) G.covers[i]=LET[ch]; });
  G.by={}; String(st.by||"").split("").forEach((ch,i)=>{ const n=+ch; if(n) G.by[i]={...(n&1?{A:1}:{}),...(n&2?{B:1}:{})}; });
  G.giver=st.gv==="B"?"B":"A"; G.turnsLeft=Math.max(0,Math.min(9,+st.tl||0)); G.clues=Array.isArray(st.cl)?st.cl.slice(-20).map(c=>({word:String(c.word||"").slice(0,24),n:String(c.n||""),team:String(c.team||""),label:String(c.label||"")})):[];
  const wasOver=!!G.over; G.over = st.o&&st.o.kind ? {kind:String(st.o.kind), why:String(st.o.why||"")} : null; if(G.over&&!wasOver) dismissed=false;
  G.nextIdx=+st.ni||G.nextIdx; G.rev=+st.rev||0; G.at=+st.at||0;
  Object.keys(G.covers).forEach(i=>{ if(!old[i]) flipIdx.add(+i); });
  if(flipIdx.size) sfx("flip");
  mismatch=null; saveGame(); render();
}
function pushSync(){ if(room&&syncOn){ room.presence({st:compactKeys()}).catch(()=>{}); } }
function syncPeers(){ if(!room) return 0; try{ return room.peers().filter(p=>!(p.isMe&&p.sameTab)&&p.presence&&p.presence.st).length; }catch(e){ return 0; } }
function onRoom(){
  if(!room) return;
  const ps=room.peers(); const me=ps.find(p=>p.isMe&&p.sameTab); if(me) myPeer=me.peer;
  let best=null;
  ps.forEach(p=>{ if(p.isMe&&p.sameTab) return; const st=p.presence&&p.presence.st; if(!st||st.m!==G.mode||st.c!==G.code) return;
    if(!best || (st.rev||0)>(best.st.rev||0) || ((st.rev||0)===(best.st.rev||0) && (st.at||0)>(best.st.at||0))) best={st,peer:p.peer}; });
  mismatch=null;
  if(best){
    const r1=best.st.rev||0, r0=G.rev||0;
    const same = best.st.g.join("|")===G.grid.join("|");
    if(r1>r0 || (r1===r0 && (best.st.at||0)>(G.at||0))) adopt(best.st);
    else if(!same && r1===r0 && r0===0){ if(myPeer && best.peer<myPeer) adopt(best.st); }
    else if(!same && r1<r0){ pushSync(); }
  }
  const hdr=document.querySelector(".top"); if(hdr){ const tmp=document.createElement("div"); tmp.innerHTML=header(); hdr.replaceWith(tmp.firstElementChild); }
}
async function joinRoom(){
  if(!roomNs || !syncOn) return;
  const name=("cn-"+G.mode+"-"+G.code).toLowerCase();
  if(room && roomName===name) { pushSync(); return; }
  await leaveRoom();
  try{
    room=await roomNs.join(name); roomName=name;
    const r=room;
    const u1=r.onPeers(()=>onRoom(), ()=>{ if(room===r){ room=null; render(); } });
    const u2=r.on("next", msg=>{
      if(msg.isMe&&msg.sameTab) return; const d=msg.data||{};
      if(!/^[A-Z]{4}$/.test(String(d.c||""))||!["classic","duet"].includes(d.m)) return;
      if(d.m===G.mode && d.c===G.code && (!d.ed||d.ed===edition)) return;
      if(d.ed && EDS[d.ed]){ edition=d.ed; ls.set("cn-ed",edition); }
      newGame(d.m, d.c, {quiet:true}); toast("Following the new grid from another device.");
    }, ()=>{});
    peerUnsub=()=>{ u1(); u2(); };
    pushSync(); render();
  }catch(e){ room=null; roomName=""; }
}
async function leaveRoom(){ try{ peerUnsub&&peerUnsub(); }catch(e){} peerUnsub=null; if(room){ try{ await room.leave(); }catch(e){} } room=null; roomName=""; mismatch=null; }

/* ---------- events ---------- */
function newGame(mode, code, opts={}){
  const prevRoom = room;
  G=deal(mode, code||newCode()); dismissed=false; picking=false; selected=new Set(); sheetFor=null; noticeText=""; side="A";
  G.rev = opts.quiet ? 0 : 1; G.at=Date.now(); saveGame(); render();
  (async()=>{
    if(prevRoom && syncOn && !opts.quiet){ try{ await prevRoom.emit("next",{m:G.mode,c:G.code,ed:edition}); }catch(e){} }
    await joinRoom(); pushSync();
  })();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab],.cn,[data-w]"); if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; ls.set("cn-tab",tab); reveal=false; render(); window.scrollTo(0,0); return; }
  if(t.classList.contains("cn")){
    const i=+t.dataset.i;
    if(picking){ selected.has(i)?selected.delete(i):selected.add(i); render(); }
    else { sheetFor=i; render(); }
    return;
  }
  if(t.dataset.w && t.closest("#pool")){ const w=t.dataset.w; banned.has(w)?banned.delete(w):banned.add(w); ls.set("banned",[...banned]); render(); return; }
  const a=t.dataset.act, v=t.dataset.v;
  if(a==="mode"){ if(G.mode!==v) newGame(v, G.code); }
  else if(a==="deal"){ newGame(G.mode); }
  else if(a==="dealpacks"){ tab="board"; ls.set("cn-tab",tab); newGame(G.mode); window.scrollTo(0,0); }
  else if(a==="endturn"){ endTurn(false); }
  else if(a==="giver"){ G.giver=G.giver==="A"?"B":"A"; changed(); }
  else if(a==="replace"){ doReplace(); }
  else if(a==="cancelrep"){ picking=false; selected=new Set(); render(); }
  else if(a==="clear"){ G.covers={}; G.by={}; G.clues=[]; G.over=null; dismissed=false; G.turn=G.first; G.turnsLeft=9; G.giver="A"; changed(); }
  else if(a==="closesheet"){ sheetFor=null; render(); }
  else if(a==="pick"){ const i=sheetFor; sheetFor=null; cover(i, v==="none"?null:v); }
  else if(a==="settings"){ settingsOpen=true; render(); }
  else if(a==="closesettings"){ settingsOpen=false; render(); }
  else if(a==="edition"){ if(edition!==v){ edition=v; ls.set("cn-ed",edition); settingsOpen=false; newGame(G.mode); sfx("win"); } }
  else if(a==="setlook"){ look=v; ls.set("cn-look",look); render(); }
  else if(a==="sound"){ soundOn=!soundOn; ls.set("cn-sound",soundOn); render(); if(soundOn) sfx("flip"); }
  else if(a==="testsound"){ sfx("agent","red"); setTimeout(()=>sfx("bystander"),450); }
  else if(a==="sync"){ syncOn=!syncOn; ls.set("cn-sync",syncOn); if(syncOn) joinRoom(); else leaveRoom().then(render); render(); }
  else if(a==="usetheirs"){ onRoom(); }
  else if(a==="pack"){ packsOn.has(v)?packsOn.delete(v):packsOn.add(v); ls.set("cn-packs",[...packsOn]); render(); }
  else if(a==="mix"){ packMix=v; ls.set("cn-mix",v); render(); }
  else if(a==="dismiss"){ dismissed=true; render(); }
  else if(a==="side"){ side=v; render(); }
  else if(a==="keep"){ keepShow=!keepShow; render(); }
  else if(a==="tint"){ tint=!tint; render(); }
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="clueform") return;
  e.preventDefault();
  const raw=$("#clueword").value.trim(), n=$("#cluen").value;
  const prob=clueProblem(raw); if(prob){ toast(prob); return; }
  const w=raw.toUpperCase().slice(0,24);
  const label = G.mode==="classic" ? TEAM[G.turn] : "Side "+G.giver;
  G.clues.push({word:w, n, team:G.mode==="classic"?G.turn:"green", label});
  sfx("clue"); changed();
});
document.addEventListener("input",e=>{
  if(e.target.id==="code"){
    const v=e.target.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4); e.target.value=v;
    if(v.length===4 && v!==G.code){ newGame(G.mode, v, {quiet:true}); setTimeout(()=>{ const c=$("#code"); if(c){ c.focus(); c.setSelectionRange(4,4);} },0); }
  } else if(e.target.id==="poolq"){
    poolQ=e.target.value; const pos=e.target.selectionStart; render(); const q=$("#poolq"); if(q){ q.focus(); q.setSelectionRange(pos,pos); }
  } else if(e.target.id==="vol"){
    volume=+e.target.value; ls.set("cn-vol",volume); const n=$("#volnum"); if(n) n.textContent=volume;
  }
});
document.addEventListener("change",e=>{ if(e.target.id==="vol") sfx("agent","blue"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && (sheetFor!=null||settingsOpen)){ sheetFor=null; settingsOpen=false; render(); } });
window.addEventListener("resize",fit);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(fit);

let G = loadGame() || deal("classic", newCode());
if(G.over) dismissed=true;
render();

(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  const [db,smp,rm]=await Promise.all([window.claude.use("db").catch(()=>null), window.claude.use("sample").catch(()=>null), window.claude.use("room").catch(()=>null)]);
  sampleFn=smp; roomNs=rm;
  if(db){
    try{
      dbRef=db.doc("deck/tracker");
      dbRef.onSnapshot(snap=>{ shared=true; if(snap.exists) S=normalize(snap.data()); if(tab==="words") render(); },
        ()=>{ dbRef=null; shared=false; });
    }catch(e){ dbRef=null; }
  }
  if(roomNs) joinRoom();
})();
</script>
